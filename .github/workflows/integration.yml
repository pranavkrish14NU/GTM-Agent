name: API Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL + Redis service containers — available at localhost within the job
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: boba_test
          POSTGRES_USER: boba_test
          POSTGRES_PASSWORD: boba_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U boba_test -d boba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Node.js setup
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/api/package-lock.json

      # -----------------------------------------------------------------------
      # Install monorepo dependencies
      # -----------------------------------------------------------------------
      - name: Install root dependencies
        run: npm ci

      - name: Install backend/api dependencies
        working-directory: backend/api
        run: npm ci

      # -----------------------------------------------------------------------
      # TypeScript check
      # -----------------------------------------------------------------------
      - name: TypeScript type check
        working-directory: backend/api
        run: npm run lint

      # -----------------------------------------------------------------------
      # Unit tests (must pass before integration)
      # -----------------------------------------------------------------------
      - name: Run unit tests
        working-directory: backend/api
        run: npm test

      # -----------------------------------------------------------------------
      # Integration tests against real PostgreSQL + pgvector
      # -----------------------------------------------------------------------
      - name: Run integration tests
        working-directory: backend/api
        env:
          TEST_DATABASE_URL: postgresql://boba_test:boba_test@localhost:5433/boba_test
          REDIS_URL: redis://localhost:6380
          NODE_ENV: test
          DRIVE_CONNECTOR: mock
        run: npm run test:integration

      # -----------------------------------------------------------------------
      # Upload test results on failure
      # -----------------------------------------------------------------------
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            backend/api/integration-results.xml
            backend/api/integration-report/
          retention-days: 7
          if-no-files-found: ignore
