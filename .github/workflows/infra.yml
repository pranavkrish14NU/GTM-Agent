name: Infrastructure (Terraform)

# Terraform plan on every PR that touches infra/.
# Terraform apply on manual dispatch (dev auto-applies on push to main).
#
# One-time prerequisites — see infra/SETUP.md:
#   1. Create GCP projects for dev, staging, production
#   2. Run bootstrap/ to create state bucket
#   3. Add GitHub repository variables (see infra/SETUP.md §3)
#   4. Set INFRA_ENABLED=true in repo vars to activate apply

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, production]
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write        # Workload Identity Federation
  pull-requests: write   # Post plan output as PR comment

env:
  TF_VERSION: '1.8.5'
  TF_ROOT: infra/terraform

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Plan — runs on every PR and on manual dispatch with action=plan
  # ─────────────────────────────────────────────────────────────────────────
  plan:
    name: terraform plan (${{ github.event.inputs.environment || 'dev' }})
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan') ||
      (github.event_name == 'push' && vars.INFRA_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=boba/${ENVIRONMENT}" \
            -reconfigure

      - name: terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform workspace select "${ENVIRONMENT}" \
            || terraform workspace new "${ENVIRONMENT}"

      - name: terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform plan \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -var="monitoring_slack_auth_token=${{ secrets.SLACK_AUTH_TOKEN || '' }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_ROOT }}/plan.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;
            const body = `## Terraform Plan — \`${{ env.ENVIRONMENT }}\`
            \`\`\`hcl
            ${truncated}
            \`\`\`
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────
  # Apply — manual dispatch only (or auto for dev on main push)
  # ─────────────────────────────────────────────────────────────────────────
  apply:
    name: terraform apply (${{ github.event.inputs.environment || 'dev' }})
    # dev auto-applies on push to main (when INFRA_ENABLED=true)
    # staging/production require explicit manual dispatch with action=apply
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'push' && vars.INFRA_ENABLED == 'true' && github.ref == 'refs/heads/main')
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SA_EMAIL }}

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=boba/${ENVIRONMENT}" \
            -reconfigure

      - name: terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform workspace select "${ENVIRONMENT}" \
            || terraform workspace new "${ENVIRONMENT}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: ${{ env.TF_ROOT }}

      - name: terraform apply
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve tfplan

      - name: Register Cloud Deploy pipeline
        if: env.ENVIRONMENT != 'dev'
        run: |
          # Apply the Cloud Deploy delivery pipeline, targets, and automation
          # resources declared in deploy/clouddeploy.yaml.
          # This is idempotent — safe to run on every apply.
          gcloud deploy apply \
            --file=deploy/clouddeploy.yaml \
            --region="${{ vars.AR_LOCATION || 'us-central1' }}" \
            --project="${{ vars.GCP_PROJECT }}"
          echo "::notice::Cloud Deploy pipeline registered for ${ENVIRONMENT}."

      - name: Output infrastructure summary
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform output -json | python3 -c "
          import json, sys
          o = json.load(sys.stdin)
          print('## Infrastructure Outputs')
          for k, v in o.items():
              val = v.get('value', '')
              if isinstance(val, dict): val = json.dumps(val, indent=2)
              print(f'- **{k}**: {val}')
          " >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No outputs."
