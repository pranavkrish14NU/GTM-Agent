name: E2E Tests (Playwright)

# Run on every PR targeting main, and on pushes to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions — workflow only reads code and uploads artifacts
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E — ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Node.js setup with dependency caching
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # -----------------------------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------------------------
      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      # -----------------------------------------------------------------------
      # Playwright browser cache
      # -----------------------------------------------------------------------
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browser)
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # -----------------------------------------------------------------------
      # TypeScript check — fail fast before running E2E
      # -----------------------------------------------------------------------
      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      # -----------------------------------------------------------------------
      # Unit tests — must pass before E2E
      # -----------------------------------------------------------------------
      - name: Run unit tests
        working-directory: frontend
        run: npm test

      # -----------------------------------------------------------------------
      # E2E tests with mock connector
      # -----------------------------------------------------------------------
      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/3)
        working-directory: frontend
        run: >
          npx playwright test
          --shard=${{ matrix.shard }}/3
          --reporter=list,html,junit
        env:
          CI: true
          DRIVE_CONNECTOR: mock
          VITE_GOOGLE_CLIENT_ID: mock-client-id
          VITE_OAUTH_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_API_URL: http://localhost:8080

      # -----------------------------------------------------------------------
      # Upload artifacts on failure
      # -----------------------------------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-shard-${{ matrix.shard }}
          path: frontend/playwright-results.xml
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7
