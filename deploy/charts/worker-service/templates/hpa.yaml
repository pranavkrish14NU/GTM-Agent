{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "worker-service.fullname" . }}
  labels:
    {{- include "worker-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "worker-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # Scale on Cloud Tasks queue depth via the custom-metrics-stackdriver adapter.
    - type: External
      external:
        metric:
          name: {{ .Values.autoscaling.externalMetricName | quote }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetQueueDepth | quote }}
{{- end }}
