{{- if .Values.cloudArmor.enabled }}
# GKE BackendConfig — binds the Cloud Armor WAF security policy to backend services.
# App services must opt in by adding this annotation:
#   cloud.google.com/backend-config: '{"default": "{{ include "platform-ingress.fullname" . }}-backend-config"}'
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "platform-ingress.fullname" . }}-backend-config
  labels:
    {{- include "platform-ingress.labels" . | nindent 4 }}
spec:
  securityPolicy:
    # Must match the terraform output `cloud_armor_policy` for this environment.
    # Pattern: boba-waf-<environment>  (set via values-<env>.yaml)
    name: {{ .Values.cloudArmor.policyName | required "cloudArmor.policyName is required when cloudArmor.enabled=true" }}
{{- end }}
