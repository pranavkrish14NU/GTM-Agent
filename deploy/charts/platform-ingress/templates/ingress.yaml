apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform-ingress.fullname" . }}
  labels:
    {{- include "platform-ingress.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer.name }}
    # AC: enforce HTTP -> HTTPS (301).
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # AC: 100 requests/minute per IP.
    nginx.ingress.kubernetes.io/limit-rpm: "{{ .Values.rateLimitRpm }}"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Values.tlsSecretName }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: {{ .Values.apiService.pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.apiService.name }}
                port:
                  number: {{ .Values.apiService.port }}
          - path: {{ .Values.frontendService.pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontendService.name }}
                port:
                  number: {{ .Values.frontendService.port }}
